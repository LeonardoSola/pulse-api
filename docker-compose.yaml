services:
  api:
    build: .
    container_name: pulse-api
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - pulse-api-net

  postgres:
    image: postgres:16-alpine
    container_name: pulse-api-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pulse-api-net

volumes:
  postgres_data:
networks:
  pulse-api-net:
    driver: bridge