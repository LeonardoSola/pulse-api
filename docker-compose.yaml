services:
  api:
    build: .
    container_name: pulse-api
    env_file:
      - .env
    environment:
      # Inside the compose network the dependencies are reached by service name.
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - pulse-api-net

  postgres:
    image: postgres:16-alpine
    container_name: pulse-api-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pulse-api-net

  # Optional: start with `docker compose --profile rabbitmq up -d`
  # and set RABBITMQ_ENABLED=true in .env.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pulse-api-rabbitmq
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - pulse-api-net

volumes:
  postgres_data:

networks:
  pulse-api-net:
    driver: bridge
